spring:
  config:
    activate:
      on-profile: dev

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  cloud:
    loadbalancer:
      cache:
        enabled: true
        ttl: 30s
    discovery:
      client:
        simple:
          instances:
            auth-service:
              - uri: ${AUTH_SERVICE_URL:http://localhost:8081}
            core-service:
              - uri: ${CORE_SERVICE_URL:http://localhost:8082}
            order-service:
              - uri: ${ORDER_SERVICE_URL:http://localhost:8083}
            tracking-service:
              - uri: ${TRACKING_SERVICE_URL:http://localhost:8084}
            payment-service:
              - uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
            notification-service:
              - uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
            analytics-service:
              - uri: ${ANALYTICS_SERVICE_URL:http://localhost:8087}
            ai-agent-service:
              - uri: ${AI_AGENT_SERVICE_URL:http://localhost:8088}


    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
              - "http://localhost:5174"
              - "http://127.0.0.1:5174"
              - "http://localhost:5175"
              - "http://127.0.0.1:5175"
              - "http://localhost:3000"
              - "http://127.0.0.1:3000"
              - "http://localhost:3001"
              - "http://127.0.0.1:3001"
              - "http://localhost:8080"
              - "http://localhost:8086"
              - "http://localhost:19006"
            allowedOriginPatterns:
              - "*"
              - "http://localhost:*"
              - "http://127.0.0.1:*"
              - "http://10.0.2.2:*"
            allowedMethods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "OPTIONS"
              - "PATCH"
            allowedHeaders: "*"
            exposedHeaders: "*"
            allowCredentials: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      routes:
        # 1. Auth Service (port 8081) - Rate limit chống brute-force (5 req/s, burst 10)
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**, /auth/**, /api/v1/users/**, /users/**, /api/v1/shippers/**, /shippers/**, /api/v1/shops-profile/**, /api/v1/areas/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /${segment}
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@authRateLimiter}"
                key-resolver: "#{@ipKeyResolver}"

        # 2. Core Service (port 8082) - Rate limit chống spam (50 req/s, burst 100)
        - id: core-service
          uri: lb://core-service
          predicates:
            - Path=/api/v1/core/**, /core/**, /api/v1/shops/**, /shops/**, /api/v1/categories/**, /categories/**, /api/v1/items/**, /items/**, /api/v1/promotions/**, /promotions/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /${segment}
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@defaultRateLimiter}"
                key-resolver: "#{@userOrIpKeyResolver}"

        # 3. Order Service (port 8083) - Rate limit chống spam đặt đơn (15 req/s, burst 30)
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**, /orders/**, /api/v1/carts/**, /carts/**, /api/v1/reviews/**, /reviews/**, /api/v1/complaints/**, /complaints/**, /api/v1/remittances/**, /remittances/**, /api/v1/commission-configs/**, /commission-configs/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /${segment}
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@orderRateLimiter}"
                key-resolver: "#{@userOrIpKeyResolver}"

        # 4. Tracking Service (port 8084) - Rate limit chống spam cập nhật tọa độ (50 req/s, burst 100)
        - id: tracking-service
          uri: lb://tracking-service
          predicates:
            - Path=/api/v1/tracking/**, /tracking/**, /api/v1/deliveries/**, /deliveries/**, /api/v1/incidents/**, /incidents/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /${segment}
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@defaultRateLimiter}"
                key-resolver: "#{@userOrIpKeyResolver}"

        # 5. Payment Service (port 8085) - Rate limit chống spam nạp rút/giao dịch ví (15 req/s, burst 30)
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**, /api/v1/payment/**, /payment/**, /payments/**, /api/v1/wallets/**, /wallets/**, /api/v1/transactions/**, /transactions/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /${segment}
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@orderRateLimiter}"
                key-resolver: "#{@userOrIpKeyResolver}"

        # 6. Notification Service (port 8086) - Rate limit chống spam gửi tin nhắn/thông báo (15 req/s, burst 30)
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**, /api/v1/notification/**, /notification/**, /notifications/**, /api/v1/messages/**, /messages/**, /api/v1/conversations/**, /conversations/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /${segment}
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@orderRateLimiter}"
                key-resolver: "#{@userOrIpKeyResolver}"

        # 6b. WebSocket Chat (Notification Service) - Định tuyến cân bằng tải qua lb://
        - id: notification-service-websocket
          uri: lb://notification-service
          predicates:
            - Path=/ws-chat/**

        # 7. Analytics Service (port 8087) - Rate limit chống DoS truy vấn báo cáo nặng (50 req/s, burst 100)
        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/v1/analytics/**, /analytics/**, /api/v1/fraud-alerts/**, /fraud-alerts/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /${segment}
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@defaultRateLimiter}"
                key-resolver: "#{@userOrIpKeyResolver}"

        # 8. AI Agent Service (Deploy riêng - trỏ trực tiếp URL) - Rate limit chống spam đốt Token AI Gemini (5 req/s, burst 10)
        - id: ai-agent-service
          uri: ${AI_AGENT_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/agent/**, /agent/**
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@aiAgentRateLimiter}"
                key-resolver: "#{@userOrIpKeyResolver}"

        # ===== SWAGGER API DOCS ROUTING (Qua Load Balancer) =====
        - id: auth-service-docs
          uri: lb://auth-service
          predicates:
            - Path=/v3/api-docs/auth-service
          filters:
            - SetPath=/v3/api-docs

        - id: core-service-docs
          uri: lb://core-service
          predicates:
            - Path=/v3/api-docs/core-service
          filters:
            - SetPath=/v3/api-docs

        - id: order-service-docs
          uri: lb://order-service
          predicates:
            - Path=/v3/api-docs/order-service
          filters:
            - SetPath=/v3/api-docs

        - id: tracking-service-docs
          uri: lb://tracking-service
          predicates:
            - Path=/v3/api-docs/tracking-service
          filters:
            - SetPath=/v3/api-docs

        - id: payment-service-docs
          uri: lb://payment-service
          predicates:
            - Path=/v3/api-docs/payment-service
          filters:
            - SetPath=/v3/api-docs

        - id: notification-service-docs
          uri: lb://notification-service
          predicates:
            - Path=/v3/api-docs/notification-service
          filters:
            - SetPath=/v3/api-docs

        - id: analytics-service-docs
          uri: lb://analytics-service
          predicates:
            - Path=/v3/api-docs/analytics-service
          filters:
            - SetPath=/v3/api-docs

        - id: ai-agent-service-docs
          uri: ${AI_AGENT_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/v3/api-docs/ai-agent-service
          filters:
            - SetPath=/openapi.json

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 1. Auth Service
        url: /v3/api-docs/auth-service
      - name: 2. Core Service
        url: /v3/api-docs/core-service
      - name: 3. Order Service
        url: /v3/api-docs/order-service
      - name: 4. Tracking Service
        url: /v3/api-docs/tracking-service
      - name: 5. Payment Service
        url: /v3/api-docs/payment-service
      - name: 6. Notification Service
        url: /v3/api-docs/notification-service
      - name: 7. Analytics Service
        url: /v3/api-docs/analytics-service
      - name: 8. AI Agent Service
        url: /v3/api-docs/ai-agent-service