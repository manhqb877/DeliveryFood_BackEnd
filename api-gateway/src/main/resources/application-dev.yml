spring:
  config:
    activate:
      on-profile: dev

  cloud:
    discovery:
      client:
        simple:
          instances:
            auth-service:
              - uri: ${AUTH_SERVICE_URL:http://localhost:8081}
            content-service:
              - uri: ${CONTENT_SERVICE_URL:http://localhost:8082}
            learning-service:
              - uri: ${LEARNING_SERVICE_URL:http://localhost:8083}
            ai-practice-service:
              - uri: ${AI_PRACTICE_SERVICE_URL:http://localhost:8084}
            payment-service:
              - uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
            notification-service:
              - uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
            teacher-service:
              - uri: ${TEACHER_SERVICE_URL:http://localhost:8087}
            social-service:
              - uri: ${SOCIAL_SERVICE_URL:http://localhost:8088}

    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
              - "http://localhost:5174"
              - "http://127.0.0.1:5174"
              - "http://localhost:5175"
              - "http://127.0.0.1:5175"
              - "http://localhost:3000"
              - "http://localhost:8080"
              - "http://localhost:8086"
              - "http://localhost:19006"
            allowedOriginPatterns:
              - "*"
              - "http://localhost:*"
              - "http://127.0.0.1:*"
              - "http://10.0.2.2:*"
            allowedMethods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "OPTIONS"
              - "PATCH"
            allowedHeaders: "*"
            exposedHeaders: "*"
            allowCredentials: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      routes:
        # 1. Auth Service (port 8081)
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**, /auth/**, /api/v1/users/**, /users/**, /admin/users, /admin/users/**, /admin/teacher-registrations, /admin/teacher-registrations/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /${segment}

        # 2. Content Service (port 8082)
        - id: content-service
          uri: ${CONTENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/content/**, /content/**, /admin/words, /admin/words/**, /admin/topics/**, /admin/courses, /admin/courses/**, /admin/lessons, /admin/lessons/**, /admin/reading-passages, /admin/reading-passages/**, /admin/listening-lessons, /admin/listening-lessons/**, /admin/readings/**, /admin/listenings/**, /admin/phrases/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /${segment}

        # 3. Learning Service (port 8083)
        - id: learning-service
          uri: ${LEARNING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/learning/**, /learning/**, /admin/quizzes, /admin/quizzes/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /${segment}


        # 4. AI Practice Service (port 8084)
        - id: ai-practice-service
          uri: ${AI_PRACTICE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/ai-practice/**, /ai-practice/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /${segment}

        # 5. Payment Service (port 8085)
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/payment/**, /payment/**, /payments/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /${segment}

        # 6. Notification Service (port 8086)
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/notification/**, /notification/**, /notifications/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /${segment}

        # 7. Teacher Service (port 8087)
        - id: teacher-service
          uri: ${TEACHER_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/teacher/**, /teacher/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /${segment}

        # 8. Social Service (port 8088)
        - id: social-service
          uri: ${SOCIAL_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/social/**, /social/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /${segment}

        # ===== SWAGGER API DOCS ROUTING =====
        - id: auth-service-docs
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/v3/api-docs/auth-service
          filters:
            - SetPath=/v3/api-docs

        - id: content-service-docs
          uri: ${CONTENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/v3/api-docs/content-service
          filters:
            - SetPath=/v3/api-docs

        - id: learning-service-docs
          uri: ${LEARNING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/v3/api-docs/learning-service
          filters:
            - SetPath=/v3/api-docs

        - id: ai-practice-service-docs
          uri: ${AI_PRACTICE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/v3/api-docs/ai-practice-service
          filters:
            - SetPath=/v3/api-docs

        - id: payment-service-docs
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/v3/api-docs/payment-service
          filters:
            - SetPath=/v3/api-docs

        - id: notification-service-docs
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/v3/api-docs/notification-service
          filters:
            - SetPath=/v3/api-docs

        - id: teacher-service-docs
          uri: ${TEACHER_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/v3/api-docs/teacher-service
          filters:
            - SetPath=/v3/api-docs

        - id: social-service-docs
          uri: ${SOCIAL_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/v3/api-docs/social-service
          filters:
            - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 1. Auth Service
        url: /v3/api-docs/auth-service
      - name: 2. Content Service
        url: /v3/api-docs/content-service
      - name: 3. Learning Service
        url: /v3/api-docs/learning-service
      - name: 4. AI Practice Service
        url: /v3/api-docs/ai-practice-service
      - name: 5. Payment Service
        url: /v3/api-docs/payment-service
      - name: 6. Notification Service
        url: /v3/api-docs/notification-service
      - name: 7. Teacher Service
        url: /v3/api-docs/teacher-service
      - name: 8. Social Service
        url: /v3/api-docs/social-service