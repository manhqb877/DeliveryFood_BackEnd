server:
  port: 8081

spring:
  config:
    import: optional:file:.env[.properties], optional:file:../.env[.properties]
  application:
    name: auth-service
  profiles:
    active: dev

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: auth

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 5000ms

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT Configuration
jwt:
  # Base64-encoded secret — generate with: openssl rand -base64 32
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000    # 1 hour in ms
  refresh-token-expiration: 604800000 # 7 days in ms

openapi:
  service:
    title: Auth Service API
    version: 1.0.0

logging:
  level:
    root: INFO
    web: INFO
    com.fooddelivery.auth: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html